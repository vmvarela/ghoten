name: Parity patch

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/patch-distribution
    paths:
      - ghoten.env
      - scripts/**
      - .github/workflows/parity-patch.yml

permissions:
  contents: read

jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate normalized Ghoten patch
        run: ./scripts/generate-patch.sh

      - name: Build single Ghoten binary
        run: ./scripts/build.sh

      - name: Smoke test version
        run: ./dist/ghoten version

      - name: Upload generated patch
        uses: actions/upload-artifact@v6
        with:
          name: ghoten-parity-patch
          path: patches/ghoten.patch
