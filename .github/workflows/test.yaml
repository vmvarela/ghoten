name: Test

on:
  pull_request:
  push:
    branches:
      - master
      - "v[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test -race -count=1 -timeout 30m ./...

  integration-tests-zot:
    name: Integration Tests (Zot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run Zot integration tests
        env:
          TF_ORAS_ZOT_TEST: "1"
        run: go test -race -count=1 -timeout 120s ./internal/backend/remote-state/oras/... -run Zot -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check go.mod tidiness
        run: |
          go mod tidy
          if [[ -n "$(git status --porcelain go.mod go.sum)" ]]; then
            echo "ERROR: go.mod/go.sum are not up-to-date. Run 'go mod tidy' and commit."
            exit 1
          fi

      - name: Run golangci-lint
        run: make golangci-lint

  generate:
    name: Check generated files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify go generate is up to date
        run: make generate-check

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run ShellCheck on action scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./action
