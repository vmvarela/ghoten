name: Finalize ORAS migration

on:
  workflow_dispatch:
  push:
    branches: [refactor/patch-distribution]
    paths:
      - scripts/migrate-oras-state.sh
      - .github/workflows/migrate-oras-state.yml

permissions:
  contents: write

concurrency:
  group: finalize-oras-state
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate and validate direct oras-state patch
        run: bash ./scripts/migrate-oras-state.sh

      - name: Pin patch and remove migration scaffolding
        run: |
          cp patches/oras-next.patch patches/oras.patch
          rm -f patches/oras-next.patch
          git rm scripts/migrate-oras-state.sh .github/workflows/migrate-oras-state.yml
          git add patches/oras.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: consume oras-state directly"
          git push origin HEAD:refactor/patch-distribution
