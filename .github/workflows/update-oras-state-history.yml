name: Update oras-state for history

on:
  push:
    branches:
      - feat/read-only-history
    paths:
      - .github/workflows/update-oras-state-history.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/read-only-history
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Update oras-state to v0.2.0
        run: make update-oras-state VERSION=v0.2.0
      - name: Commit generated patch
        run: |
          if git diff --quiet -- patches/oras.patch; then
            echo "No dependency update required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches/oras.patch
          git commit -m "build(deps): update oras-state to v0.2.0"
          git push origin HEAD:feat/read-only-history
