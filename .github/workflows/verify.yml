name: Verify

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Verify patches and focused tests
        env:
          GHOTEN_VERIFY_OUTPUT: ${{ runner.temp }}/ghoten
        run: bash ./scripts/verify.sh

      - name: Verify ORAS backend lifecycle
        env:
          GHOTEN_BIN: ${{ runner.temp }}/ghoten
        run: bash ./scripts/e2e-oras.sh

      - name: Verify native package definition
        env:
          GHOTEN_BIN: ${{ runner.temp }}/ghoten
        shell: bash
        run: |
          set -euo pipefail
          NFPM_VERSION=2.45.1
          curl --fail --silent --show-error --location \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            -o /tmp/nfpm.tar.gz
          echo "317b2747561b6329d6c5e1fe002a1a33f90b2c3c3da2b7b4fe4c3154e98c5ff8  /tmp/nfpm.tar.gz" | sha256sum --check -
          sudo tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm

          mkdir -p pkg-work/dist
          cp "$GHOTEN_BIN" pkg-work/ghoten
          cp LICENSE pkg-work/LICENSE

          for packager in deb rpm apk; do
            VERSION=0.0.0 GOARCH=amd64 \
              nfpm package \
                -p "$packager" \
                -f "$GITHUB_WORKSPACE/packaging/nfpm.yaml" \
                -t "pkg-work/dist/"
          done

          test "$(find pkg-work/dist -maxdepth 1 -type f | wc -l)" -eq 3
