name: Verify

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Verify patches and focused tests
        env:
          GHOTEN_VERIFY_OUTPUT: ${{ runner.temp }}/ghoten
        run: bash ./scripts/verify.sh

      - name: Verify ORAS backend lifecycle
        env:
          GHOTEN_BIN: ${{ runner.temp }}/ghoten
        run: bash ./scripts/e2e-oras.sh

      - name: Verify release installer
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/install.sh
          INSTALL_DIR="${RUNNER_TEMP}/ghoten-install" sh scripts/install.sh
          test -x "${RUNNER_TEMP}/ghoten-install/ghoten"
          "${RUNNER_TEMP}/ghoten-install/ghoten" version
