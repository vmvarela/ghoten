name: Verify

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Verify patches and focused tests
        env:
          GHOTEN_VERIFY_OUTPUT: ${{ runner.temp }}/ghoten
        run: bash ./scripts/verify.sh

      - name: Verify ORAS backend lifecycle
        env:
          GHOTEN_BIN: ${{ runner.temp }}/ghoten
        run: bash ./scripts/e2e-oras.sh
