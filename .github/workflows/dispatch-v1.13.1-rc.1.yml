name: Dispatch v1.13.1-rc.1

on:
  push:
    branches:
      - release/dispatch-v1.13.1-rc.1
    paths:
      - .github/workflows/dispatch-v1.13.1-rc.1.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref master \
            -f release_type=prerelease \
            -f prerelease_suffix=rc.1
