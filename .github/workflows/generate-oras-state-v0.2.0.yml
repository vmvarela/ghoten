name: Generate oras-state v0.2.0 patch

on:
  push:
    branches:
      - build/oras-state-v0.2.0
    paths:
      - .github/workflows/generate-oras-state-v0.2.0.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: build/oras-state-v0.2.0
          fetch-depth: 0

      - name: Regenerate dependency patch
        run: make update-oras-state VERSION=v0.2.0

      - name: Commit generated patch only
        run: |
          rm .github/workflows/generate-oras-state-v0.2.0.yml
          git add patches/oras.patch .github/workflows/generate-oras-state-v0.2.0.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(deps): use oras-state v0.2.0"
          git push origin HEAD:build/oras-state-v0.2.0
