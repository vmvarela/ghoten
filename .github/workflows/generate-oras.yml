name: Generate ORAS patch

on:
  workflow_dispatch:
  push:
    branches: [refactor/patch-distribution]
    paths:
      - ghoten.env
      - scripts/generate-oras.sh
      - .github/workflows/generate-oras.yml

permissions:
  contents: write

concurrency:
  group: ghoten-oras-patch
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash ./scripts/generate-oras.sh

      - name: Commit generated ORAS patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches/oras.patch
          if ! git diff --cached --quiet; then
            git commit -m "build: pin generated ORAS patch"
            git push origin HEAD:refactor/patch-distribution
          fi

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: oras-patch
          path: patches/oras.patch
          if-no-files-found: ignore
