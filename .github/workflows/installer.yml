name: Installer

on:
  pull_request:
    paths:
      - scripts/install.sh
      - .github/workflows/installer.yml
  push:
    branches:
      - master
    paths:
      - scripts/install.sh
      - .github/workflows/installer.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-latest-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Validate installer syntax
        run: sh -n scripts/install.sh

      - name: Install latest stable release
        env:
          INSTALL_DIR: ${{ runner.temp }}/ghoten-install
        run: |
          set -euo pipefail
          sh scripts/install.sh
          test -x "$INSTALL_DIR/ghoten"
          "$INSTALL_DIR/ghoten" version
