name: Validate ORAS updater

on:
  push:
    branches:
      - build/update-oras-state
    paths:
      - .github/workflows/validate-oras-updater.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: build/update-oras-state
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: false

      - name: Run updater twice and prove idempotency
        shell: bash
        run: |
          set -euo pipefail

          bash ./scripts/update-oras-state.sh v0.1.0
          FIRST="$(sha256sum patches/oras.patch | cut -d' ' -f1)"

          bash ./scripts/update-oras-state.sh v0.1.0
          SECOND="$(sha256sum patches/oras.patch | cut -d' ' -f1)"

          if [[ "$FIRST" != "$SECOND" ]]; then
            echo "::error::ORAS patch updater is not idempotent."
            exit 1
          fi

          echo "Idempotent patch hash: $SECOND"

      - name: Commit canonical dependency hunks if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- patches/oras.patch; then
            echo "Current ORAS dependency hunks are already canonical."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches/oras.patch
          git commit -m "build: canonicalize ORAS dependency patch"
          git push origin HEAD:build/update-oras-state
