name: Release

on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag (e.g. v1.12.0). Leave empty for dry run / snapshot."
        required: false

permissions:
  contents: write
  packages: write

# ---------------------------------------------------------------------------
# Validate
# ---------------------------------------------------------------------------
jobs:
  release-drafter:
    name: Update Release Draft
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test -race -count=1 -timeout 30m ./...

  validate:
    name: Validate
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_release: ${{ steps.version.outputs.is_release }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
            echo "tag=${TAG}"                        >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}"                  >> "$GITHUB_OUTPUT"
            echo "is_release=true"                   >> "$GITHUB_OUTPUT"
            echo "is_prerelease=${{ github.event.release.prerelease }}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.tag }}" && "${{ inputs.tag }}" == v* ]]; then
            TAG="${{ inputs.tag }}"
            echo "tag=${TAG}"                        >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}"                  >> "$GITHUB_OUTPUT"
            echo "is_release=true"                   >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false"               >> "$GITHUB_OUTPUT"
          else
            echo "tag="                              >> "$GITHUB_OUTPUT"
            echo "version=snapshot"                  >> "$GITHUB_OUTPUT"
            echo "is_release=false"                  >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false"               >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ steps.version.outputs.tag || github.sha }}

  # ---------------------------------------------------------------------------
  # Build — one job per platform (14 parallel jobs)
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: [validate, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - { goos: linux,   goarch: "386" }
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm }
          - { goos: linux,   goarch: arm64 }
          # Windows
          - { goos: windows, goarch: "386" }
          - { goos: windows, goarch: amd64 }
          # Darwin
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          # FreeBSD
          - { goos: freebsd, goarch: "386" }
          - { goos: freebsd, goarch: amd64 }
          - { goos: freebsd, goarch: arm }
          # NetBSD
          - { goos: netbsd, goarch: "386" }
          - { goos: netbsd, goarch: amd64 }
          - { goos: netbsd, goarch: arm }
          # OpenBSD
          - { goos: openbsd, goarch: "386" }
          - { goos: openbsd, goarch: amd64 }
          # Solaris
          - { goos: solaris, goarch: amd64 }
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build binary
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          BINARY="ghoten"
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            BINARY="ghoten.exe"
          fi

          go build \
            -mod=readonly \
            -trimpath \
            -ldflags="-s -w -X 'github.com/vmvarela/ghoten/version.dev=no' -X 'github.com/vmvarela/ghoten/version.versionOverride=${VERSION}'" \
            -o "${BINARY}" \
            ./cmd/ghoten

      - name: Package artifacts
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          NAME="ghoten_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"

          mkdir -p dist
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            BINARY="ghoten.exe"
          else
            BINARY="ghoten"
          fi

          # tar.gz
          tar -czf "dist/${NAME}.tar.gz" "${BINARY}" LICENSE
          # zip
          zip -j "dist/${NAME}.zip" "${BINARY}" LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 5

  # ---------------------------------------------------------------------------
  # Aggregate — checksums, signatures, GitHub Release
  # ---------------------------------------------------------------------------
  aggregate:
    name: Aggregate & Upload Assets
    runs-on: ubuntu-latest
    needs: [validate, build]
    permissions:
      contents: write
      id-token: write  # needed for keyless cosign signing
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag || github.sha }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        id: hashes
        working-directory: dist
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          shasum -a 256 ghoten_${VERSION}_*.tar.gz ghoten_${VERSION}_*.zip \
            > "ghoten_${VERSION}_SHA256SUMS"
          # Expose base64-encoded hashes for the SLSA provenance generator.
          echo "hashes=$(cat ghoten_${VERSION}_SHA256SUMS | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: needs.validate.outputs.is_release == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign archives and checksums (keyless)
        if: needs.validate.outputs.is_release == 'true'
        working-directory: dist
        env:
          COSIGN_YES: "true"
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          # Sign every archive and the checksum file; cosign writes
          # <file>.sig and <file>.pem (certificate) alongside each artifact.
          for f in ghoten_${VERSION}_*.tar.gz ghoten_${VERSION}_*.zip ghoten_${VERSION}_SHA256SUMS; do
            cosign sign-blob \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "${f}"
          done

      - name: Upload assets to release
        if: needs.validate.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.validate.outputs.tag }}"
          gh release upload "${TAG}" dist/* --clobber --repo "${{ github.repository }}"

      - name: Upload snapshot artifacts
        if: needs.validate.outputs.is_release != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-snapshot
          path: dist/
          retention-days: 5

  # ---------------------------------------------------------------------------
  # SLSA provenance — generic SLSA3 provenance for all release artifacts
  # ---------------------------------------------------------------------------
  slsa:
    name: SLSA Provenance
    needs: [validate, aggregate]
    if: needs.validate.outputs.is_release == 'true'
    permissions:
      actions: read    # To read the workflow path.
      id-token: write  # To sign the provenance.
      contents: write  # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.aggregate.outputs.hashes }}"
      upload-assets: true
      upload-tag-name: "${{ needs.validate.outputs.tag }}"

  # ---------------------------------------------------------------------------
  # Docker — multi-arch images (only for real releases)
  # ---------------------------------------------------------------------------
  docker:
    name: Docker Images
    runs-on: ubuntu-latest
    needs: [validate, build]
    if: needs.validate.outputs.is_release == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write  # needed for keyless cosign signing
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag || github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Linux build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: build-linux-*
          path: builds/
          merge-multiple: true

      - name: Extract Linux binaries
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          mkdir -p binaries/linux/{amd64,arm64,arm,386}
          for arch in amd64 arm64 arm 386; do
            tar -xzf "builds/ghoten_${VERSION}_linux_${arch}.tar.gz" -C "binaries/linux/${arch}/"
          done

      - name: Determine Docker tags (full)
        id: tags-full
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          REPO="ghcr.io/${{ github.repository }}"
          TAGS="${REPO}:${VERSION}"
          if [[ "${{ needs.validate.outputs.is_prerelease }}" != "true" ]]; then
            TAGS="${TAGS},${REPO}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Determine Docker tags (minimal)
        id: tags-minimal
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          REPO="ghcr.io/${{ github.repository }}"
          TAGS="${REPO}:${VERSION}-minimal"
          if [[ "${{ needs.validate.outputs.is_prerelease }}" != "true" ]]; then
            TAGS="${TAGS},${REPO}:minimal"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build & push full images
        id: docker-full
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm,linux/386
          push: true
          build-contexts: |
            binaries=binaries
          tags: ${{ steps.tags-full.outputs.tags }}
          labels: |
            org.opencontainers.image.title=ghoten
            org.opencontainers.image.description=Ghoten ${{ needs.validate.outputs.version }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MPL-2.0
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}

      - name: Build & push minimal images
        id: docker-minimal
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.minimal
          platforms: linux/amd64,linux/arm64,linux/arm,linux/386
          push: true
          build-contexts: |
            binaries=binaries
          tags: ${{ steps.tags-minimal.outputs.tags }}
          labels: |
            org.opencontainers.image.title=ghoten
            org.opencontainers.image.description=Ghoten ${{ needs.validate.outputs.version }} (minimal)
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MPL-2.0
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign full Docker images (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign \
            "ghcr.io/${{ github.repository }}@${{ steps.docker-full.outputs.digest }}"

      - name: Sign minimal Docker images (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign \
            "ghcr.io/${{ github.repository }}@${{ steps.docker-minimal.outputs.digest }}"

  # ---------------------------------------------------------------------------
  # Floating version tags — enables vmvarela/ghoten@v1 and @v1.12
  # ---------------------------------------------------------------------------
  update-action-tags:
    name: Update Action Version Tags
    runs-on: ubuntu-latest
    needs: [validate, aggregate]
    if: needs.validate.outputs.is_release == 'true' && needs.validate.outputs.is_prerelease != 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: Update floating tags
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          # Note: this job only runs for stable releases
          # (see: needs.validate.outputs.is_prerelease != 'true' in the job condition),
          # so prerelease tags like v1.12.0-rc1 are excluded and these patterns are safe.
          # Parse semver: v1.12.0 → major=v1, minor=v1.12
          MAJOR=$(echo "$TAG" | grep -oE '^v[0-9]+')
          MINOR=$(echo "$TAG" | grep -oE '^v[0-9]+\.[0-9]+')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Force-update major tag (v1)
          git tag -fa "$MAJOR" -m "Release ${TAG}" "$TAG"
          git push -f origin "$MAJOR"
          echo "✅ Updated ${MAJOR} → ${TAG}"

          # Force-update minor tag (v1.12)
          git tag -fa "$MINOR" -m "Release ${TAG}" "$TAG"
          git push -f origin "$MINOR"
          echo "✅ Updated ${MINOR} → ${TAG}"

